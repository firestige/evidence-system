name: Evidence CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q tests/unit

  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv build

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: wsr_evidence
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: wsr_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wsr_evidence -d wsr_evidence"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WSR_EVIDENCE_DATABASE_URL: postgresql://wsr_evidence:ci-only@localhost:5432/wsr_evidence
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m integration tests/integration

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker compose -f deployment/compose.yaml config --quiet
      - run: docker build -f deployment/Dockerfile .
