services:
  database:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: wsr_evidence
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: wsr_evidence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsr_evidence -d wsr_evidence"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - evidence-data:/var/lib/postgresql

  migrate:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      WSR_EVIDENCE_DATABASE_URL: postgresql+psycopg://wsr_evidence@database/wsr_evidence
    depends_on:
      database:
        condition: service_healthy

  evidence:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      WSR_EVIDENCE_BIND_SCOPE: container
      WSR_EVIDENCE_DATABASE_URL: postgresql://wsr_evidence@database/wsr_evidence
      WSR_EVIDENCE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4318/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  evidence-data:
